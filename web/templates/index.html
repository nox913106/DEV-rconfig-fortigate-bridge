<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortigate 備份瀏覽器</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242736;
    --border: #2e3347;
    --accent: #4f8ef7;
    --accent-dim: #1e3a6e;
    --green: #3dd68c;
    --green-dim: #1a4a34;
    --text: #e2e8f0;
    --text-dim: #8892a4;
    --red: #f56565;
    --amber: #f6a623;
    --amber-dim: #3d2000;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header svg { color: var(--accent); flex-shrink: 0; }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: .3px; }
  header span.subtitle { color: var(--text-dim); font-size: 13px; }
  header .spacer { flex: 1; }

  /* ── Language Switcher ── */
  .lang-switch {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .lang-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    padding: 5px 10px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: background .12s, color .12s;
  }
  .lang-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
  }
  .lang-btn:hover:not(.active) { color: var(--text); }

  /* ── Layout ── */
  .page { max-width: 1100px; margin: 32px auto; padding: 0 20px; }

  /* ── Tabs ── */
  .tab-bar {
    display: flex;
    gap: 0;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-dim);
    padding: 10px 20px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    display: inline-flex; align-items: center; gap: 8px;
    margin-bottom: -1px;
    transition: color .15s, border-color .15s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn.archived-tab.active { color: var(--amber); border-bottom-color: var(--amber); }
  .tab-count {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1px 8px;
    font-size: 11px;
    color: var(--text-dim);
  }

  /* ── Device Grid ── */
  #device-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .device-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    cursor: pointer;
    transition: border-color .15s, transform .1s;
  }
  .device-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .device-card .icon {
    width: 40px; height: 40px;
    border-radius: 8px;
    background: var(--accent-dim);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
    color: var(--accent);
  }
  .device-card h3 {
    font-size: 13px;
    font-weight: 600;
    word-break: break-all;
    margin-bottom: 8px;
  }
  .device-card .meta {
    color: var(--text-dim);
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .device-card .latest-date { color: var(--green); font-size: 12px; }
  .device-card .no-backup { color: var(--text-dim); font-style: italic; }

  /* ── Archived card variant ── */
  .device-card.archived .icon {
    background: var(--amber-dim);
    color: var(--amber);
  }
  .device-card.archived:hover { border-color: var(--amber); transform: translateY(-2px); }
  .stale-warn { color: var(--amber); font-size: 12px; }
  .archived-badge {
    display: inline-flex; align-items: center; gap: 3px;
    background: var(--amber-dim);
    color: var(--amber);
    border-radius: 4px;
    font-size: 10px;
    padding: 2px 7px;
    font-weight: 600;
    margin-top: 6px;
    width: fit-content;
  }

  /* ── Loading / Empty ── */
  .spinner {
    display: flex; justify-content: center; align-items: center;
    padding: 60px; color: var(--text-dim); gap: 10px;
  }
  .dot-pulse::after {
    content: '...';
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80%, 100% { content: '...'; }
  }

  /* ── Calendar View ── */
  #calendar-view { display: none; }

  .back-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 7px 14px;
    cursor: pointer;
    font-size: 13px;
    display: inline-flex; align-items: center; gap: 6px;
    transition: border-color .15s, color .15s;
    margin-bottom: 24px;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .cal-header h2 { font-size: 18px; font-weight: 600; }
  .cal-header .device-sub { color: var(--text-dim); font-size: 13px; margin-top: 2px; }

  .month-nav {
    display: flex; align-items: center; gap: 12px;
  }
  .month-nav button {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 34px; height: 34px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s;
  }
  .month-nav button:hover { border-color: var(--accent); color: var(--accent); }
  #month-label {
    min-width: 120px;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
  }

  /* ── Calendar Grid ── */
  .calendar-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 24px;
  }

  .cal-day-names {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 8px;
  }
  .cal-day-names span {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    padding: 4px 0;
    text-transform: uppercase;
  }

  #cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .cal-cell {
    aspect-ratio: 1;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    position: relative;
    transition: background .12s;
  }
  .cal-cell.empty { background: transparent; }
  .cal-cell.no-backup {
    color: var(--text-dim);
    cursor: default;
  }
  .cal-cell.has-backup {
    background: var(--green-dim);
    color: var(--green);
    cursor: pointer;
    font-weight: 600;
    border: 1px solid transparent;
    transition: border-color .12s, background .12s;
  }
  .cal-cell.has-backup:hover {
    border-color: var(--green);
    background: #1f5a3e;
  }
  .cal-cell.selected {
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .cal-cell .badge {
    font-size: 9px;
    margin-top: 2px;
    opacity: .75;
  }
  .cal-cell.today-marker::after {
    content: '';
    position: absolute;
    bottom: 4px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* ── File List ── */
  #file-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: none;
  }
  .file-panel-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .file-panel-header h3 { font-size: 14px; font-weight: 600; }
  .file-panel-header .file-count {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .file-item {
    display: flex;
    align-items: center;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    gap: 14px;
    transition: background .1s;
  }
  .file-item:last-child { border-bottom: none; }
  .file-item:hover { background: var(--surface2); }
  .file-item .file-icon { color: var(--text-dim); flex-shrink: 0; }
  .file-item .file-name {
    flex: 1;
    font-size: 13px;
    word-break: break-all;
  }
  .file-item .file-name .ext-conf { color: var(--accent); }
  .file-item .file-name .ext-txt { color: var(--green); }
  .file-item .file-size {
    color: var(--text-dim);
    font-size: 12px;
    white-space: nowrap;
  }
  .dl-btn {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    text-decoration: none;
    display: inline-flex; align-items: center; gap: 5px;
    transition: background .12s;
  }
  .dl-btn:hover { background: #1e3a6e; }
</style>
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="2" y="3" width="20" height="14" rx="2"/>
    <path d="M8 21h8M12 17v4"/>
    <path d="M7 8h10M7 11h6"/>
  </svg>
  <h1 data-i18n="title"></h1>
  <span class="subtitle" data-i18n="subtitle"></span>
  <div class="spacer"></div>
  <div class="lang-switch">
    <button class="lang-btn" data-lang="zh-TW" onclick="setLang('zh-TW')">繁中</button>
    <button class="lang-btn" data-lang="zh-CN" onclick="setLang('zh-CN')">简中</button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
  </div>
</header>

<!-- Device List View -->
<div class="page" id="device-view">
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-btn-active" onclick="switchTab('active')">
      <span data-i18n="tabActive"></span>
      <span class="tab-count" id="tab-count-active">—</span>
    </button>
    <button class="tab-btn archived-tab" id="tab-btn-archived" onclick="switchTab('archived')">
      <span data-i18n="tabArchived"></span>
      <span class="tab-count" id="tab-count-archived">—</span>
    </button>
  </div>
  <div id="device-grid">
    <div class="spinner"><span class="dot-pulse" id="loading-text"></span></div>
  </div>
</div>

<!-- Calendar View -->
<div class="page" id="calendar-view">
  <button class="back-btn" onclick="showDeviceList()">
    <span data-i18n="backBtn"></span>
  </button>

  <div class="cal-header">
    <div>
      <h2 id="cal-device-name"></h2>
      <div class="device-sub" id="cal-device-sub"></div>
    </div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span id="month-label"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </div>

  <div class="calendar-wrap">
    <div class="cal-day-names" id="cal-day-names"></div>
    <div id="cal-grid"></div>
  </div>

  <div id="file-panel">
    <div class="file-panel-header">
      <h3 id="file-panel-title"></h3>
      <span class="file-count" id="file-count"></span>
    </div>
    <div id="file-list"></div>
  </div>
</div>

<script>
// ── i18n ───────────────────────────────────────────────
const LANG = {
  'zh-TW': {
    title:          'Fortigate 備份瀏覽器',
    subtitle:       'FortigateFirewalls 設定檔歸檔',
    tabActive:      '線上設備',
    tabArchived:    '舊資料保留',
    backBtn:        '← 返回設備清單',
    dayNames:       ['日','一','二','三','四','五','六'],
    loadingDevices: '載入設備清單',
    errorDevices:   '無法載入設備清單',
    noArchived:     '沒有超過 30 天未備份的設備',
    noDevices:      '找不到任何 Fortigate 設備',
    daysAgo:        n => `${n} 天前`,
    neverBacked:    '從未備份',
    lastBackupLabel:'最後備份',
    filesCount:     n => `${n} 個檔案`,
    archivedBadge:  '⚠ 超過 30 天未備份',
    latestBackup:   '最新備份',
    noBackup:       '尚無備份',
    loading:        '載入中…',
    loadFailed:     '載入失敗',
    noFiles:        '此日期無檔案',
    download:       '↓ 下載',
    latestSub:      d => `最新備份：${d}`,
    noBackupSub:    '尚無備份',
    dateLabel:      '日期：',
    monthLabel:     (y, m) => `${y} 年 ${['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'][m-1]}`,
    dayTitle:       (y, m, d) => `${y} 年 ${m} 月 ${d} 日`,
    backupBadge:    '備份',
    fileCount:      n => `${n} 個檔案`,
    mtimeLocale:    'zh-TW',
  },
  'zh-CN': {
    title:          'Fortigate 备份浏览器',
    subtitle:       'FortigateFirewalls 配置文件归档',
    tabActive:      '在线设备',
    tabArchived:    '旧数据保留',
    backBtn:        '← 返回设备列表',
    dayNames:       ['日','一','二','三','四','五','六'],
    loadingDevices: '加载设备列表',
    errorDevices:   '无法加载设备列表',
    noArchived:     '没有超过 30 天未备份的设备',
    noDevices:      '找不到任何 Fortigate 设备',
    daysAgo:        n => `${n} 天前`,
    neverBacked:    '从未备份',
    lastBackupLabel:'最后备份',
    filesCount:     n => `${n} 个文件`,
    archivedBadge:  '⚠ 超过 30 天未备份',
    latestBackup:   '最新备份',
    noBackup:       '暂无备份',
    loading:        '加载中…',
    loadFailed:     '加载失败',
    noFiles:        '该日期无文件',
    download:       '↓ 下载',
    latestSub:      d => `最新备份：${d}`,
    noBackupSub:    '暂无备份',
    dateLabel:      '日期：',
    monthLabel:     (y, m) => `${y} 年 ${['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'][m-1]}`,
    dayTitle:       (y, m, d) => `${y} 年 ${m} 月 ${d} 日`,
    backupBadge:    '备份',
    fileCount:      n => `${n} 个文件`,
    mtimeLocale:    'zh-CN',
  },
  'en': {
    title:          'Fortigate Backup Browser',
    subtitle:       'FortigateFirewalls Config Archive',
    tabActive:      'Active Devices',
    tabArchived:    'Archived',
    backBtn:        '← Back to Devices',
    dayNames:       ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
    loadingDevices: 'Loading devices...',
    errorDevices:   'Failed to load devices',
    noArchived:     'No devices inactive for over 30 days',
    noDevices:      'No Fortigate devices found',
    daysAgo:        n => `${n} day${n !== 1 ? 's' : ''} ago`,
    neverBacked:    'Never backed up',
    lastBackupLabel:'Last backup',
    filesCount:     n => `${n} file${n !== 1 ? 's' : ''}`,
    archivedBadge:  '⚠ Inactive 30+ days',
    latestBackup:   'Latest backup',
    noBackup:       'No backup yet',
    loading:        'Loading...',
    loadFailed:     'Load failed',
    noFiles:        'No files for this date',
    download:       '↓ Download',
    latestSub:      d => `Latest: ${d}`,
    noBackupSub:    'No backup yet',
    dateLabel:      'Date: ',
    monthLabel:     (y, m) => `${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]} ${y}`,
    dayTitle:       (y, m, d) => `${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]} ${d}, ${y}`,
    backupBadge:    'bkp',
    fileCount:      n => `${n} file${n !== 1 ? 's' : ''}`,
    mtimeLocale:    'en-US',
  }
};

let currentLang = localStorage.getItem('lang') || 'zh-TW';
if (!LANG[currentLang]) currentLang = 'zh-TW';

function t(key, ...args) {
  const val = LANG[currentLang][key];
  return typeof val === 'function' ? val(...args) : val;
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('lang', lang);
  document.documentElement.lang = lang;
  applyStaticI18n();
  // Re-render current view
  if (currentDevice) {
    document.getElementById('cal-device-sub').textContent =
      currentDevice.latest ? t('latestSub', currentDevice.latest) : t('noBackupSub');
    document.getElementById('month-label').textContent =
      t('monthLabel', currentYear, currentMonth);
    renderCalendarDayNames();
    renderCalendar();
    if (selectedDay !== null) {
      const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][currentMonth - 1];
      document.getElementById('file-panel-title').textContent =
        t('dayTitle', currentYear, currentMonth, selectedDay);
      const fc = document.getElementById('file-count').textContent;
      // file count badge — re-parse from current text (already set)
    }
  } else {
    renderDeviceGrid(allDevices);
  }
}

function applyStaticI18n() {
  // Update data-i18n elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  // Update page title
  document.title = t('title');
  // Update loading spinner if still visible
  const loadingText = document.getElementById('loading-text');
  if (loadingText) loadingText.textContent = t('loadingDevices');
  // Update lang button active state
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
  });
}

function renderCalendarDayNames() {
  const names = t('dayNames');
  document.getElementById('cal-day-names').innerHTML =
    names.map(n => `<span>${n}</span>`).join('');
}

// ── State ──────────────────────────────────────────────
let allDevices    = [];
let currentTab    = 'active';
let currentDevice = null;
let currentYear   = new Date().getFullYear();
let currentMonth  = new Date().getMonth() + 1; // 1-12
let activeDays    = [];
let selectedDay   = null;

const MON_ABBR = ['Jan','Feb','Mar','Apr','May','Jun',
                  'Jul','Aug','Sep','Oct','Nov','Dec'];

// ── Views ──────────────────────────────────────────────
function showDeviceList() {
  document.getElementById('device-view').style.display = '';
  document.getElementById('calendar-view').style.display = 'none';
  currentDevice = null;
}

async function showCalendar(device) {
  currentDevice = device;
  selectedDay   = null;

  document.getElementById('device-view').style.display = 'none';
  document.getElementById('calendar-view').style.display = 'block';
  document.getElementById('cal-device-name').textContent = device.name;
  document.getElementById('cal-device-sub').textContent =
    device.latest ? t('latestSub', device.latest) : t('noBackupSub');
  document.getElementById('file-panel').style.display = 'none';

  if (device.latest) {
    const parts = device.latest.split('-');
    currentYear  = parseInt(parts[0]);
    currentMonth = parseInt(parts[1]);
  } else {
    currentYear  = new Date().getFullYear();
    currentMonth = new Date().getMonth() + 1;
  }

  renderCalendarDayNames();
  await loadCalendar();
}

// ── Tab Switching ──────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-btn-active').classList.toggle('active', tab === 'active');
  document.getElementById('tab-btn-archived').classList.toggle('active', tab === 'archived');
  renderDeviceGrid(allDevices);
}

// ── Data Loaders ───────────────────────────────────────
async function loadDevices() {
  try {
    const res = await fetch('/api/devices');
    allDevices = await res.json();
    renderDeviceGrid(allDevices);
  } catch (e) {
    document.getElementById('device-grid').innerHTML =
      `<div class="spinner" style="color:var(--red)">${t('errorDevices')}</div>`;
  }
}

async function loadCalendar() {
  document.getElementById('cal-grid').innerHTML =
    `<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--text-dim)">${t('loading')}</div>`;
  document.getElementById('file-panel').style.display = 'none';

  document.getElementById('month-label').textContent =
    t('monthLabel', currentYear, currentMonth);

  try {
    const res = await fetch(
      `/api/devices/${encodeURIComponent(currentDevice.name)}/calendar/${currentYear}/${currentMonth}`
    );
    activeDays = await res.json();
  } catch (e) {
    activeDays = [];
  }

  renderCalendar();
}

async function loadDayFiles(day) {
  selectedDay = day;
  renderCalendar();

  const mon = MON_ABBR[currentMonth - 1];
  document.getElementById('file-panel-title').textContent =
    t('dayTitle', currentYear, currentMonth, day);
  document.getElementById('file-panel').style.display = 'block';
  document.getElementById('file-list').innerHTML =
    `<div class="spinner" style="padding:20px">${t('loading')}</div>`;

  try {
    const res = await fetch(
      `/api/devices/${encodeURIComponent(currentDevice.name)}/files/${currentYear}/${mon}/${day}`
    );
    const files = await res.json();
    renderFileList(files, day, mon);
  } catch (e) {
    document.getElementById('file-list').innerHTML =
      `<div class="spinner" style="color:var(--red)">${t('loadFailed')}</div>`;
  }
}

// ── Renderers ─────────────────────────────────────────
function renderDeviceGrid(devices) {
  const activeCount   = devices.filter(d => !d.archived).length;
  const archivedCount = devices.filter(d =>  d.archived).length;
  document.getElementById('tab-count-active').textContent   = activeCount;
  document.getElementById('tab-count-archived').textContent = archivedCount;

  const filtered = devices.filter(d => currentTab === 'archived' ? d.archived : !d.archived);
  const grid = document.getElementById('device-grid');

  if (!filtered.length) {
    const msg = currentTab === 'archived' ? t('noArchived') : t('noDevices');
    grid.innerHTML = `<div class="spinner">${msg}</div>`;
    return;
  }

  grid.innerHTML = filtered.map(d => {
    if (d.archived) {
      const daysText = d.daysAgo != null ? t('daysAgo', d.daysAgo) : t('neverBacked');
      return `
        <div class="device-card archived" data-device='${JSON.stringify(d).replace(/'/g, "&#39;")}'>
          <div class="icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
              <polyline points="21 8 21 21 3 21 3 8"/>
              <rect x="1" y="3" width="22" height="5"/>
              <line x1="10" y1="12" x2="14" y2="12"/>
            </svg>
          </div>
          <h3>${escHtml(d.name)}</h3>
          <div class="meta">
            <span class="stale-warn">${t('lastBackupLabel')} ${daysText}</span>
            ${d.latest ? `<span>${t('dateLabel')}${escHtml(d.latest)}</span>` : ''}
            <span>${t('filesCount', d.totalFiles)}</span>
            <span class="archived-badge">${t('archivedBadge')}</span>
          </div>
        </div>`;
    } else {
      return `
        <div class="device-card" data-device='${JSON.stringify(d).replace(/'/g, "&#39;")}'>
          <div class="icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <path d="M8 21h8M12 17v4"/>
            </svg>
          </div>
          <h3>${escHtml(d.name)}</h3>
          <div class="meta">
            ${d.latest
              ? `<span class="latest-date">${t('latestBackup')} ${escHtml(d.latest)}</span>`
              : `<span class="no-backup">${t('noBackup')}</span>`}
            <span>${t('filesCount', d.totalFiles)}</span>
          </div>
        </div>`;
    }
  }).join('');

  grid.querySelectorAll('.device-card').forEach(card => {
    card.addEventListener('click', () => {
      const d = JSON.parse(card.dataset.device);
      showCalendar(d);
    });
  });
}

function renderCalendar() {
  const grid = document.getElementById('cal-grid');
  const today = new Date();

  const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();

  const activeSet = new Set(activeDays);
  let html = '';

  for (let i = 0; i < firstDay; i++) {
    html += '<div class="cal-cell empty"></div>';
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const hasBackup = activeSet.has(d);
    const isSelected = (d === selectedDay);
    const isToday = (
      today.getFullYear() === currentYear &&
      today.getMonth() + 1 === currentMonth &&
      today.getDate() === d
    );

    let cls = 'cal-cell';
    if (hasBackup) cls += isSelected ? ' selected' : ' has-backup';
    else           cls += ' no-backup';
    if (isToday && !hasBackup) cls += ' today-marker';

    const onclick = hasBackup ? `loadDayFiles(${d})` : '';
    html += `
      <div class="${cls}" ${onclick ? `onclick="${onclick}"` : ''}>
        ${d}
        ${hasBackup ? `<span class="badge">${t('backupBadge')}</span>` : ''}
      </div>`;
  }

  grid.innerHTML = html;
  document.getElementById('file-count').textContent = '';
}

function renderFileList(files, day, mon) {
  document.getElementById('file-count').textContent = t('fileCount', files.length);

  if (!files.length) {
    document.getElementById('file-list').innerHTML =
      `<div class="spinner" style="padding:16px;color:var(--text-dim)">${t('noFiles')}</div>`;
    return;
  }

  document.getElementById('file-list').innerHTML = files.map(f => {
    const ext = f.name.split('.').pop().toLowerCase();
    const nameHtml = f.name.replace(/\.(conf|txt)$/i,
      `.<span class="ext-${ext === 'conf' ? 'conf' : 'txt'}">$1</span>`);
    const size = fmtSize(f.size);
    const mtime = new Date(f.mtime * 1000).toLocaleString(t('mtimeLocale'));
    const href =
      `/download/${encodeURIComponent(currentDevice.name)}` +
      `/${currentYear}/${mon}/${day}/${encodeURIComponent(f.name)}`;

    return `
      <div class="file-item">
        <svg class="file-icon" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <div class="file-name">
          ${nameHtml}
          <div style="color:var(--text-dim);font-size:11px;margin-top:2px">${mtime}</div>
        </div>
        <span class="file-size">${size}</span>
        <a class="dl-btn" href="${href}" download>
          ${t('download')}
        </a>
      </div>`;
  }).join('');
}

// ── Month Navigation ───────────────────────────────────
function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 12) { currentMonth = 1;  currentYear++; }
  if (currentMonth < 1)  { currentMonth = 12; currentYear--; }
  selectedDay = null;
  loadCalendar();
}

// ── Utils ──────────────────────────────────────────────
function fmtSize(bytes) {
  if (bytes < 1024)        return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ───────────────────────────────────────────────
applyStaticI18n();
loadDevices();
</script>
</body>
</html>
