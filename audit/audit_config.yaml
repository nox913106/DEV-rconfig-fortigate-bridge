# ==========================================
# FortiGate 帳號分類設定
# ==========================================
#
# 分類優先順序：
#   1. 帳號名稱符合 named_accounts → 直接分類
#   2. remote-group 符合 remote_group_categories → 依 group 分類
#   3. 以上皆不符合 → unknown（需人工確認）

account_categories:

  # 優先級 1：已知固定帳號，依名稱直接分類
  named_accounts:
    local_rw:           # 本機 R/W 管理員（super_admin profile）
      - fg
    local_ro:           # 本機 RO 管理員（reviewer profile）
      - twspadmin
    remote_rw:          # 遠端 R/W 管理員（TACACS+）
      - Tacacs_admin    # 台灣站
      - Tacacs-admin    # 印度站（命名略異）
    api_ro:             # REST API RO 管理員
      - API_Read

  # 優先級 2：個人 LDAP 帳號，依 remote-group 分類
  # （帳號名稱隨人員異動，不能用名稱白名單）
  remote_group_categories:
    remote_guest:       # Guest Wi-Fi 管理員
      - "Guest Admin"
      - "Guest_admin"           # 台中 121G 命名略異
      - "Captive Portal-LDAP"   # 部分站點使用
      - "Captive Portal-ID"     # 印度 Kavin
      - "Captive Portal-AWS"    # 印度 VSP